services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/quiz.sqlite
      HINT_IMAGE_PATH: /app/assets/goiygoc.jpeg
      REWARD_IMAGE_PATH: /app/assets/goiy.jpeg
    volumes:
      - quiz-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 8s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  quiz-data:
